name: CRYOGENE - prevision quotidienne

on:
  schedule:
    - cron: "40 8 * * *"    # run IFS de 00 UTC (publie jusqu'a +180 h vers 8 h UTC)
    - cron: "40 20 * * *"   # run IFS de 12 UTC
  workflow_dispatch:         # bouton "Run workflow" pour lancer a la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cryogene
  cancel-in-progress: false

jobs:
  prevision:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CUVETTE_ROOT: ${{ github.workspace }}/data
      CUVETTE_TERRAIN: ${{ github.workspace }}/data/terrain_features.npz
      CUVETTE_ECMWF_ARCHIVE: /tmp/ecmwf
      CUVETTE_ECMWF_SOURCE: azure        # miroir ECMWF open data sur Azure (meme cloud que les runners)
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependances
        run: pip install -r requirements.txt

      - name: Verifier les donnees
        run: |
          for f in models/cuvette_hgb_ifs.joblib terrain_features.npz stations_cuvette.csv; do
            test -f "data/$f" || { echo "::error::data/$f manquant (voir README.md)"; exit 1; }
          done

      - name: Prevision CRYOGENE
        run: python forecast_html.py --no-open --res 200   # relief exporte a ~200 m

      - name: Preparer le site
        run: |
          mkdir -p _site
          cp data/prevision/cryogene_derniere.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: prevision
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
