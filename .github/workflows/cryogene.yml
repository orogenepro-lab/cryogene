name: CRYOGENE - prevision quotidienne

on:
  schedule:
    - cron: "40 2 * * *"    # run IFS de 18 UTC (0-90 h, complete par celui de 12 UTC)
    - cron: "40 8 * * *"    # run IFS de 00 UTC (complet jusqu'a +180 h)
    - cron: "40 14 * * *"   # run IFS de 06 UTC (0-90 h, complete par celui de 00 UTC)
    - cron: "40 20 * * *"   # run IFS de 12 UTC
  workflow_dispatch:         # bouton "Run workflow" pour lancer a la main

permissions:
  contents: read

concurrency:
  group: cryogene
  cancel-in-progress: false

jobs:
  prevision:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CUVETTE_ROOT: ${{ github.workspace }}/data
      CUVETTE_TERRAIN: ${{ github.workspace }}/data/terrain_features.npz
      CUVETTE_ECMWF_ARCHIVE: /tmp/ecmwf
      CUVETTE_ECMWF_SOURCE: azure        # miroir ECMWF open data sur Azure (meme cloud que les runners)
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependances
        run: pip install -r requirements.txt

      - name: Verifier les donnees
        run: |
          for f in models/cuvette_hgb_ifs.joblib terrain_features.npz stations_cuvette.csv; do
            test -f "data/$f" || { echo "::error::data/$f manquant (voir README.md)"; exit 1; }
          done

      - name: Prevision CRYOGENE
        run: python forecast_html.py --no-open --res 200   # relief exporte a ~200 m

      - name: Publier la page sur le depot public cryogene-site
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          test -n "$SITE_TOKEN" || { echo "::error::secret SITE_TOKEN manquant (voir README.md)"; exit 1; }
          mkdir site_out
          cp data/prevision/cryogene_derniere.html site_out/index.html
          touch site_out/.nojekyll
          cd site_out
          git init -q -b main
          git config user.name "cryogene-bot"
          git config user.email "cryogene-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Prevision $(date -u +'%Y-%m-%d %H:%M') UTC"
          # un seul commit, ecrase a chaque run : le depot public reste minuscule
          git push --force "https://x-access-token:${SITE_TOKEN}@github.com/orogenepro-lab/cryogene-site.git" main
